services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: elmesson
      POSTGRES_USER: elmesson
      POSTGRES_PASSWORD: elmesson
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U elmesson"], interval: 5s, retries: 5 }
  app:
    build: .
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://elmesson:elmesson@db:5432/elmesson
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    env_file: [.env]

volumes: { pgdata: {} }
