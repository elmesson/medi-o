name: Android Build

on:
  push:
    branches: [main]
    paths: ['mobile/**']
  pull_request:
    branches: [main]
    paths: ['mobile/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web (Vite)
        run: npm run build

      - name: Generate Android project
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -alias elmesson-debug \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -keystore android/app/debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Elmesson, OU=Dev, O=Elmesson, L=Sao Paulo, ST=SP, C=BR"

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Build release APK (unsigned)
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: elmesson-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: elmesson-release
          path: mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "## Android Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug APK**: \`elmesson-debug\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release APK**: \`elmesson-release\` (unsigned)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download artifacts from the Actions tab." >> $GITHUB_STEP_SUMMARY
